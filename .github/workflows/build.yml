name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk Lupa.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Lupa-apk
          path: Lupa.apk

      # Ссылка для скачивания на телефоне: Releases → latest → Lupa.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          TAG="v${VERSION}-build${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" Lupa.apk \
            --title "Лупа ${VERSION} (сборка ${GITHUB_RUN_NUMBER})" \
            --notes "Сборка из ${GITHUB_SHA::7}. Установка: скачайте Lupa.apk на телефон и откройте." \
            --latest

      # Копия APK в ветке apk — чтобы забирать файл через git.
      - name: Push APK to apk branch
        run: |
          mkdir /tmp/out && cp Lupa.apk /tmp/out/
          cd /tmp/out
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add Lupa.apk
          git commit -q -m "APK из ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" apk
